name: Publish pyttr to PyPI

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: Branch to publish
        required: true
        type: choice
        options:
          - 1.x
          - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_line }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release metadata
        env:
          RELEASE_LINE: ${{ inputs.release_line }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected_major = "1" if os.environ["RELEASE_LINE"] == "1.x" else "2"
          assert project["name"] == "pyttr", project["name"]
          assert project["version"].split(".")[0] == expected_major, project["version"]
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pyttr-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyttr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyttr-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
