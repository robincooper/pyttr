[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyttr2"
version = "0.1.0"
description = "A cleaned-up Python implementation of Type Theory with Records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ipython",
  "numpy",
]

[project.optional-dependencies]
display = [
  "PySide6",
]
dev = [
  "ipykernel",
  "nbclient",
  "nbformat",
  "pytest",
  "torch>=2.0",
  "torch-hd>=5.8",
]
notebooks = [
  "jupyterlab",
]
spa = [
  "torch>=2.0",
  "torch-hd>=5.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
